spring:
  datasource:
    url: jdbc:h2:mem:piletest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: ${REDIS_TEST_HOST:localhost}
      port: ${REDIS_TEST_PORT:6379}
      timeout: 3000ms
logging:
  level:
    root: warn
    com.px.base: info
app:
  demo:
    seed: false
  schema:
    guard: false
